apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinela
  namespace: sentinela
  labels:
    app: sentinela
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinela
  template:
    metadata:
      labels:
        app: sentinela
        version: v1
    spec:
      serviceAccountName: sentinela-sa
      containers:
        - name: sentinela
          # Substitua pela URI do seu repositório ECR
          image: YOUR_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/sentinela:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: sentinela-env
          volumeMounts:
            - name: db-storage
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 300
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 300
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: sentinela-db
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinela-sa
  namespace: sentinela
  annotations:
    # Substitua pelo ARN da role com permissão de AssumeRole nas contas dos clientes
    eks.amazonaws.com/role-arn: arn:aws:iam::YOUR_ACCOUNT_ID:role/sentinela-role
