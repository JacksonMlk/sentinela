<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portal do Cliente — Sentinela</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #06091a;
      overflow: hidden;
      position: relative;
    }

    /* Ambient glow blobs */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: -10%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(255,103,154,0.18) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 55vw;
      height: 55vw;
      background: radial-gradient(circle, rgba(11,25,86,0.7) 0%, rgba(255,103,154,0.08) 50%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    /* Logo */
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .logo-icon {
      width: 72px;
      height: 72px;
      filter: drop-shadow(0 0 24px rgba(255,103,154,0.6));
    }
    .logo-title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    .logo-sub {
      font-size: 12px;
      font-weight: 400;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.5px;
      text-align: center;
      margin-top: -10px;
    }

    /* Card */
    .login-card {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 36px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .token-input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 16px;
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      letter-spacing: 0.3px;
    }
    .token-input::placeholder {
      color: rgba(255,255,255,0.25);
      font-size: 12px;
    }
    .token-input:focus {
      border-color: rgba(255,103,154,0.7);
      background: rgba(255,103,154,0.06);
      box-shadow: 0 0 0 3px rgba(255,103,154,0.12);
    }

    .btn-access {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #FF679A 0%, #e0457a 100%);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 6px 24px rgba(255,103,154,0.35);
    }
    .btn-access:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 10px 32px rgba(255,103,154,0.45);
    }
    .btn-access:active {
      transform: translateY(0);
      opacity: 1;
    }

    /* Error */
    .error-msg {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(220,38,38,0.12);
      border: 1px solid rgba(220,38,38,0.25);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #fca5a5;
    }
    .error-msg::before { content: '⚠'; font-size: 14px; }

    /* Footer */
    .login-footer {
      font-size: 11.5px;
      color: rgba(255,255,255,0.25);
      text-align: center;
      line-height: 1.7;
    }
    .login-footer a { color: rgba(255,103,154,0.7); text-decoration: none; }
    .login-footer a:hover { color: #FF679A; }
  </style>
</head>
<body>

<div class="login-wrapper">

  <!-- Logo -->
  <div class="logo-area">
    <!-- Sentinela logo — two overlapping rounded hexagons + center sparkle -->
    <svg class="logo-icon" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Left rounded hexagon ring -->
      <path d="M30 60 L60 15 L100 15 L130 60 L100 105 L60 105 Z"
            fill="none" stroke="#FF679A" stroke-width="18"
            stroke-linejoin="round" stroke-linecap="round"/>
      <!-- Right rounded hexagon ring -->
      <path d="M70 95 L100 50 L140 50 L170 95 L140 140 L100 140 Z"
            fill="none" stroke="#FF679A" stroke-width="18"
            stroke-linejoin="round" stroke-linecap="round"/>
      <!-- Center 4-pointed sparkle -->
      <path d="M100 68 C100 68 103 80 112 84 C103 88 100 100 100 100 C100 100 97 88 88 84 C97 80 100 68 100 68 Z"
            fill="#FF679A"/>
    </svg>
    <div style="text-align:center">
      <div class="logo-title">Portal do Cliente</div>
      <div class="logo-sub">Sentinela FinOps &amp; Security</div>
    </div>
  </div>

  <!-- Card -->
  <div class="login-card">
    {% if error %}
    <div class="error-msg">Token inválido ou expirado. Verifique com sua equipe Sentinela.</div>
    {% endif %}

    <form method="POST" action="/portal/login" autocomplete="off">
      <div class="field-label">Token de acesso</div>
      <input
        class="token-input"
        type="text"
        name="token"
        placeholder="Cole seu token aqui..."
        autofocus
        required
        spellcheck="false"
        autocomplete="off"
      />
      <div style="margin-top:20px">
        <button type="submit" class="btn-access">Acessar Portal</button>
      </div>
    </form>
  </div>

  <!-- Footer -->
  <div class="login-footer">
    Não tem um token? Entre em contato com a<br/>
    <a href="mailto:contato@sentinela.io">equipe Sentinela</a>
  </div>

</div>

</body>
</html>
